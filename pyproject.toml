[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "3d_tennis_lab"
version = "0.0.1"
description = "A project for 3D analysis of tennis matches, tracking court, players, and ball."
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [{ name = "motoki", email = "kamimura098@gamil.com" }]

# Base runtime deps (was [tool.poetry.dependencies] minus python line)
dependencies = [
  "requests>=2.32",
  "tqdm>=4.67",
  "pyyaml>=6.0",
  "rich>=13.7",
]

# Tell uv where the named index "torch-cuda" lives
[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true   # optional but recommended so only explicit packages use it

# Point selected packages at that index
[tool.uv.sources]
torch = { index = "torch-cuda" }
torchvision = { index = "torch-cuda" }
torchaudio = { index = "torch-cuda" }

# Git source for panopticapi (keep the name in the group array above)
panopticapi = { git = "https://github.com/cocodataset/panopticapi", rev = "7bb4655548f98f3fedc07bf37e9040a992b054b0" }

[dependency-groups]
ml = [
  "torch==2.8.0+cu128",
  "torchvision==0.23.0+cu128",
  "torchaudio==2.8.0+cu128",
  "numpy>=2.2",
  "scipy>=1.16",
  "pandas>=2.3",
  "scikit-learn>=1.7",
  "pytorch-lightning>=2.5",
  "transformers>=4.55",
  "timm>=1.0",
  "einops>=0.8",
  "yacs>=0.1",
]

vision = [
  "scikit-image>=0.24",
  "albumentations>=2.0",
  "imageio>=2.37",
  "pillow>=11.0",
  "trimesh>=4.7",
  "pyrender>=0.1",
  "smplx>=0.1",
  # Git deps go in sources (see §2), but keep the name here:
  "panopticapi",
]

data = [
  "pyarrow>=21.0",
  "fastparquet>=2024.11",
  "fsspec>=2025.9",
  "gdown>=5.2",
]

notebook = [
  "jupyterlab>=4.4",
  "matplotlib>=3.10",
  "seaborn>=0.13",
]

docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "mkdocstrings>=0.26",
]

dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "coverage>=7.10",
  "mypy>=1.17",
  "pre-commit>=3.8",
  "tox>=4.28",
  "yt-dlp==2025.8.22",
]

# Tell hatch which package directory to include when building
[tool.hatch.build.targets.wheel]
packages = ["3d_tennis_system"]

[tool.mypy]
files = ["3d_tennis_system"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests", "development", "experiments"]
addopts = "--import-mode=importlib --cov=3d_tennis_system --cov=development --cov=experiments --cov-branch --cov-report=xml"
pythonpath = ["."]
markers = [
  "dataset: end-to-end dataset visualisation tests",
  "unit: fast unit tests covering core components",
  "e2e: integration or end-to-end scenarios",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true
exclude = [".venv", "build", "dist", ".mypy_cache", ".pytest_cache", "site", "docs/_site"]

[tool.ruff.format]
preview = true

[tool.ruff.lint]
select = ["E","W","F","I","UP","B","C4","SIM","RUF"]
ignore = ["E501", "F841"]
preview = true

[tool.ruff.lint.per-file-ignores]
"tools/**" = ["E","W","I","UP","B","C4","SIM","RUF"]
"experiments/**" = ["E","W","I","UP","B","C4","SIM","RUF"]
"development/**" = ["E","W","I","UP","B","C4","SIM","RUF"]
"developments/**" = ["E","W","I","UP","B","C4","SIM","RUF"]
"**/tests/**" = ["E","W","I","UP","B","C4","SIM","RUF"]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["3d_tennis_system", "development", "experiments"]
omit = [
  "config.py",
  "config-*.py",
  "*/.venv/*",
]
