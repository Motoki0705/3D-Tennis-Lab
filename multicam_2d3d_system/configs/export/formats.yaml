reconstruction:
  format: parquet
  path: ${workspace.outputs}/recon_3d
tracks:
  format: json
  path: ${workspace.outputs}/tracks_2d
visualization:
  overlay_video:
    enabled: true
    output_dir: ${workspace.outputs}/viz/overlays
    codec: mp4v
  render3d:
    enabled: true
    backend: open3d
    output_path: ${workspace.outputs}/viz/reconstruction.ply
