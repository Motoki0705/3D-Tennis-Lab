# @package _global_

defaults:
  - model_cfg: dino_detr
  - data: coco_player_core
  - callbacks: lightning_default
  - _self_

project: "player_analysis"
experiment: "dino_detr"
task: train
device: cuda

# Core datamodule built via factory with augmentations
# Edit paths to your dataset as needed.
datamodule:
  _target_: development.core.data_core.build.build_datamodule
  cfg_like: ${data}

model:
  _target_: development.player_analysis.dino_detr.model.factory.create_model
  cfg_like: ${model_cfg}
  device: ${device}

loss:
  _target_: development.player_analysis.dino_detr.model.factory.create_loss
  cfg_like: ${model_cfg}
  device: ${device}

lit_module:
  _target_: development.player_analysis.dino_detr.model.factory.create_lit_module

metrics: {}
