# @package _global_

defaults:
  - override /data: dino_detr
  - override /model: dino_detr
  - override /training: dino_detr
  - override /callbacks: lightning_default
  - _self_

project: "player_analysis"
experiment: "dino_detr"
task: train
device: auto

callbacks:
  custom:
    detection_logger:
      _target_: development.player_analysis.dino_detr.callbacks.tb_image_logger.TensorBoardDetectionImageLogger
      every_n_steps: 200
      num_samples: 2
      mode: val

datamodule:
  _target_: development.player_analysis.dino_detr.training.datamodule.build_datamodule
  cfg_like: ${data}

model:
  _target_: development.player_analysis.dino_detr.model.factory.create_model
  cfg_like: ${model}
  device: ${device}

loss:
  _target_: development.player_analysis.dino_detr.model.factory.create_loss
  cfg_like: ${model}
  device: ${device}

lit_module:
  _target_: development.player_analysis.dino_detr.model.factory.create_lit_module

metrics: {}
