custom:
  _target_: development.core.callbacks.plaggable_logger.HeatmapLoggerPluggable
  max_samples: 2
  render_fn:
    _target_: development.player_analysis.dino_detr_pose.callbacks.keypoint_render.render_pose_overlays
    tag_overlay: PoseOverlay
    tag_pred: PosePred
    tag_gt: PoseGT
    max_instances: 3
    score_threshold: 0.3
    visibility_threshold: 0.05

model_checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: "${hydra:runtime.output_dir}/checkpoints"
  filename: "epoch={epoch}-val_loss={val/loss:.3f}"
  monitor: "val/loss"
  mode: "min"
  save_top_k: 3
  save_last: true

learning_rate_monitor:
  _target_: pytorch_lightning.callbacks.LearningRateMonitor
  logging_interval: "step"
