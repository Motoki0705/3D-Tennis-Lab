trainer:
  max_epochs: 50
  accelerator: "gpu"
  devices: 1
  precision: 32
  gradient_clip_val: 0.1
  log_every_n_steps: 50

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]

lr_scheduler:
  name: cosine_warmup
  max_epochs: ${trainer.max_epochs}
  warmup_epochs: 1
  min_lr: 1.0e-6
  warmup_start_lr: 1.0e-6

accumulate_grad_batches: 1
