accelerator: auto
devices: 1
precision: 16-mixed
max_epochs: 40
val_check_interval: 1.0
log_every_n_steps: 50

optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4

lr_scheduler:
  name: cosine_warmup
  interval: epoch
  warmup_epochs: 1
  warmup_start_lr: 1.0e-6
  min_lr: 0.0
  max_epochs: ${training.max_epochs}
