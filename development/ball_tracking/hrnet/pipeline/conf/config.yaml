defaults:
  - _self_
  - runner: detect
  - model: wasb
  - detector: tracknetv2
  - transform: default
  - tracker: online
  - dataloader: default
hydra:
  run:
    dir: .
  output_subdir: null

paths:
  videos_root: data/raw/videos
  out_root: data/processed/ball
  images_dir: ${paths.out_root}/images
  inference_dir: ${paths.out_root}/inference
  ann_clips_dir: ${paths.out_root}/ann/clips
  ann_final: ${paths.out_root}/ann/final/annotations.json
  state_db: ${paths.out_root}/state/index.sqlite

inference:
  model: hrnet
  method: WASB-SBDT
  batch_size: 32
  save_every_n_frames: 100
  model_path: third_party/WASB-SBDT/weights/wasb_tennis_best.pth.tar

clip_extractor:
  strategy: contiguous
  contiguous:
    max_gap_frames: 2
    min_clip_len: 8
  clustering:
    algo: dbscan
    features: [t, xc, yc, conf]
    eps: 0.8
    min_samples: 10
    min_clip_len: 8

export:
  write_frames: true
  jpg_quality: 90

merge:
  only_accept: true

logging:
  level: INFO

command: run
clip: null
