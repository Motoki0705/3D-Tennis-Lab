# @package data

paths:
  train:
    images: ${oc.env:BALL_SEQ_IMAGES_ROOT, "data/processed/ball/images"}
    annotation: ${oc.env:BALL_SEQ_LABELED_JSON, "data/processed/ball/annotation.json"}
  val:
    images: null
    annotation: null
  test:
    images: null
    annotation: null
  unlabeled:
    annotation: null

dataset:
  image_size: [640, 640]
  output_stride: 4
  heatmap_sigma: 2.0
  sequence:
    length: 8
    stride: 1
    allow_partial_last: false
    drop_short_clips: false
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

dataloader:
  batch_size: 4
  num_workers: 4
  pin_memory: true
  persistent_workers: false

splits:
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0
  seed: 42

# Convenience mirrors for the dataset builder.
images_root: ${paths.train.images}
labeled_json: ${paths.train.annotation}
img_size: ${dataset.image_size}
output_stride: ${dataset.output_stride}
sigma_px: ${dataset.heatmap_sigma}
sequence_length: ${dataset.sequence.length}
batch_size: ${dataloader.batch_size}
num_workers: ${dataloader.num_workers}
val_ratio: ${splits.val_ratio}
prefetch_factor: 2
