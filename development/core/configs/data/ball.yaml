# Core defaults for ball-tracking style datasets.
paths:
  train:
    images: "data/processed/ball/images"
    annotation: "data/processed/ball/annotation.json"
  val:
    images: null
    annotation: null
  test:
    images: null
    annotation: null
  unlabeled:
    annotation: null

dataset:
  image_size: [288, 512]
  output_stride: 1
  heatmap_sigma: 3.0
  sequence:
    length: 3
    stride: 1
    allow_partial_last: false
    drop_short_clips: false
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  categories:
    names: ["ball"]

# DataLoader setup shared across experiments.
dataloader:
  batch_size: 16
  num_workers: 4
  pin_memory: true
  persistent_workers: false

# Dataset-level splitting strategy (applied when a single annotation file is provided).
splits:
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0
  seed: 42

# Default augmentation knobs (tasks can override or disable).
augmentations:
  horizontal_flip:
    prob: 0.5
  affine:
    prob: 0.3
    scale_limit: 0.05
    shift_limit: 0.05
  gaussian_blur:
    prob: 0.0
    kernel: 3
  color_jitter:
    prob: 0.3
    brightness: 0.1
    contrast: 0.1
    saturation: 0.05
    hue: 0.03
